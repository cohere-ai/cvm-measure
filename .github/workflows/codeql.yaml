name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
