[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cvm-measure"
version = "0.1.0"
description = "Compute expected confidential VM register values from firmware, UKI, and baseline inputs"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [
    {name = "Cohere, Inc."},
]
keywords = ["tdx", "confidential-computing", "attestation", "measurement", "cvm", "tee"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cohere-ai/cvm-measure"
Repository = "https://github.com/cohere-ai/cvm-measure"
Issues = "https://github.com/cohere-ai/cvm-measure/issues"

[project.optional-dependencies]
# Pinned so a new upstream release cannot change lint/type results in CI.
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==2.3.1",
    "ruff==0.16.3",
]
security = [
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]
release = [
    "build==1.5.0",
    "twine==7.0.0",
]

[project.scripts]
cvm-measure = "cvm_measure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
